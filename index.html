<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- SEO -->
    <title>Adrian Trif — Backend Engineer & Software Developer</title>
    <meta name="description" content="Adrian Trif — Backend engineer with 4+ years experience. Master's in Advanced Programming. Scalable systems, clean architecture, purpose-built APIs." />
    <meta name="theme-color" content="#090909" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Fonts: DNS prefetch + preconnect first -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Load only the weights we actually use:
      Space Grotesk 300,400,600,700  (body text)
      Bebas Neue 400                 (display titles — thin subset)
      display=swap prevents FOIT
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
